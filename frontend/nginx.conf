server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads can reach 500 MB (encrypted media); nginx's 1 MB
    # default would reject every real attachment.
    client_max_body_size 600m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ---------------- security headers ----------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Strict CSP: no inline scripts, no external origins except self
    # (Google Fonts is the only external resource the app loads).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss: ws:; worker-src 'self' blob:; font-src 'self' https://fonts.gstatic.com" always;

    # HSTS is commented out on purpose: it must be enabled only once
    # the deployment is served over HTTPS.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The HTML shell must ALWAYS be revalidated: Vite emits
    # content-hashed asset filenames, so a fresh index.html is
    # what tells every browser to fetch the new bundle. Without
    # this header browsers (Opera, Firefox, Safari...) heuristically
    # cache the shell and keep serving a stale app after updates.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed build assets are immutable by name — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): a client-supplied X-Forwarded-For
        # must not be trusted by the backend's rate limiter. $remote_addr
        # is the real peer that connected to nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket -> backend (connection upgrade)
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # Deny dotfiles / backups
    location ~ /\. {
        deny all;
    }
}